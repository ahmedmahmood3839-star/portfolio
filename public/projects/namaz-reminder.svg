<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#042F2E" />
      <stop offset="100%" stop-color="#021C1B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D4B3F" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#08332B" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Islamic Geometric Pattern Overlay -->
  <g opacity="0.08" stroke="#10B981" stroke-width="1.5">
    <circle cx="300" cy="190" r="140" />
    <circle cx="300" cy="190" r="100" />
    <rect x="230" y="120" width="140" height="140" rx="20" transform="rotate(45 300 190)" />
    <rect x="230" y="120" width="140" height="140" rx="20" />
  </g>

  <!-- Header Bar -->
  <rect x="24" y="24" width="552" height="48" rx="10" fill="#022822" fill-opacity="0.8" />
  <circle cx="48" cy="48" r="8" fill="#10B981" />
  <text x="68" y="53" fill="#ECFDF5" font-family="'Sora', sans-serif" font-size="14" font-weight="600">Namaz Reminder — Pakistan</text>
  <rect x="440" y="34" width="120" height="28" rx="14" fill="#047857" />
  <text x="500" y="52" fill="#D1FAE5" font-family="'Sora', sans-serif" font-size="11" font-weight="600" text-anchor="middle">OFFLINE-FIRST</text>

  <!-- Main Hero Card: Next Prayer & Countdown -->
  <rect x="24" y="86" width="340" height="170" rx="12" fill="url(#cardGrad)" stroke="#059669" stroke-width="1" />
  <text x="44" y="116" fill="#A7F3D0" font-family="'Sora', sans-serif" font-size="12" font-weight="500">NEXT PRAYER • KARACHI (HANAFI)</text>
  <text x="44" y="156" fill="#FFFFFF" font-family="'Sora', sans-serif" font-size="32" font-weight="700">Asr — 4:45 PM</text>
  <text x="44" y="184" fill="#F59E0B" font-family="'Sora', sans-serif" font-size="13" font-weight="600">Starts in 01h : 24m : 12s</text>

  <!-- Feature Highlights -->
  <rect x="44" y="206" width="90" height="24" rx="6" fill="#065F46" />
  <text x="89" y="222" fill="#D1FAE5" font-family="'Sora', sans-serif" font-size="10" font-weight="500" text-anchor="middle">Urdu + English</text>

  <rect x="142" y="206" width="90" height="24" rx="6" fill="#065F46" />
  <text x="187" y="222" fill="#D1FAE5" font-family="'Sora', sans-serif" font-size="10" font-weight="500" text-anchor="middle">Qaza Tracker</text>

  <rect x="240" y="206" width="104" height="24" rx="6" fill="#065F46" />
  <text x="292" y="222" fill="#D1FAE5" font-family="'Sora', sans-serif" font-size="10" font-weight="500" text-anchor="middle">Qur'an &amp; Adhkar</text>

  <!-- Side Card: Qibla Compass Sensor -->
  <rect x="380" y="86" width="196" height="170" rx="12" fill="#022822" fill-opacity="0.9" stroke="#059669" stroke-width="1" />
  <text x="478" y="114" fill="#A7F3D0" font-family="'Sora', sans-serif" font-size="12" font-weight="600" text-anchor="middle">LIVE QIBLA COMPASS</text>
  <circle cx="478" cy="170" r="46" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <!-- Compass Needle -->
  <line x1="478" y1="170" x2="478" y2="134" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
  <line x1="478" y1="170" x2="478" y2="206" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  <circle cx="478" cy="170" r="4" fill="#FBBF24" />
  <text x="478" y="238" fill="#FBBF24" font-family="'Sora', sans-serif" font-size="11" font-weight="700" text-anchor="middle">258° W • Kaaba</text>

  <!-- Bottom Prayer Time Badges -->
  <g transform="translate(24, 272)">
    <!-- Fajr -->
    <rect x="0" y="0" width="102" height="76" rx="8" fill="#042F2E" stroke="#065F46" stroke-width="1" />
    <text x="51" y="26" fill="#6EE7B7" font-family="'Sora', sans-serif" font-size="11" font-weight="600" text-anchor="middle">FAJR</text>
    <text x="51" y="48" fill="#FFFFFF" font-family="'Sora', sans-serif" font-size="14" font-weight="700" text-anchor="middle">5:12 AM</text>
    <text x="51" y="64" fill="#34D399" font-family="'Sora', sans-serif" font-size="9" text-anchor="middle">Completed</text>

    <!-- Dhuhr -->
    <rect x="112" y="0" width="102" height="76" rx="8" fill="#042F2E" stroke="#065F46" stroke-width="1" />
    <text x="163" y="26" fill="#6EE7B7" font-family="'Sora', sans-serif" font-size="11" font-weight="600" text-anchor="middle">DHUHR</text>
    <text x="163" y="48" fill="#FFFFFF" font-family="'Sora', sans-serif" font-size="14" font-weight="700" text-anchor="middle">12:28 PM</text>
    <text x="163" y="64" fill="#34D399" font-family="'Sora', sans-serif" font-size="9" text-anchor="middle">Completed</text>

    <!-- Asr -->
    <rect x="224" y="0" width="102" height="76" rx="8" fill="#065F46" stroke="#10B981" stroke-width="1.5" />
    <text x="275" y="26" fill="#FBBF24" font-family="'Sora', sans-serif" font-size="11" font-weight="700" text-anchor="middle">ASR (HANAFI)</text>
    <text x="275" y="48" fill="#FFFFFF" font-family="'Sora', sans-serif" font-size="14" font-weight="700" text-anchor="middle">4:45 PM</text>
    <text x="275" y="64" fill="#FBBF24" font-family="'Sora', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Upcoming</text>

    <!-- Maghrib -->
    <rect x="336" y="0" width="102" height="76" rx="8" fill="#042F2E" stroke="#065F46" stroke-width="1" />
    <text x="387" y="26" fill="#6EE7B7" font-family="'Sora', sans-serif" font-size="11" font-weight="600" text-anchor="middle">MAGHRIB</text>
    <text x="387" y="48" fill="#FFFFFF" font-family="'Sora', sans-serif" font-size="14" font-weight="700" text-anchor="middle">6:32 PM</text>
    <text x="387" y="64" fill="#94A3B8" font-family="'Sora', sans-serif" font-size="9" text-anchor="middle">Sunset</text>

    <!-- Isha -->
    <rect x="448" y="0" width="104" height="76" rx="8" fill="#042F2E" stroke="#065F46" stroke-width="1" />
    <text x="500" y="26" fill="#6EE7B7" font-family="'Sora', sans-serif" font-size="11" font-weight="600" text-anchor="middle">ISHA</text>
    <text x="500" y="48" fill="#FFFFFF" font-family="'Sora', sans-serif" font-size="14" font-weight="700" text-anchor="middle">7:54 PM</text>
    <text x="500" y="64" fill="#94A3B8" font-family="'Sora', sans-serif" font-size="9" text-anchor="middle">Karachi 18°</text>
  </g>
</svg>
